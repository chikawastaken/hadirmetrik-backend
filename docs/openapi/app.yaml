openapi: 3.1.0
info:
  title: HadirMetrik API — App (Auth, Tasks, Leave, HR, Notifications)
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    Kontrak endpoint minimum untuk autentikasi yang dipakai bersama oleh
    developer backend Laravel dan developer mobile Flutter.

    Aturan kontrak:

    - Semua endpoint berada di bawah prefix `/api/v1`.
    - Semua request dan response berformat JSON (`Accept: application/json`).
    - Endpoint terproteksi memakai header `Authorization: Bearer <token>`.
    - Response sukses: `{ "success": true, "data": <...>, "message": <opsional> }`.
    - Response error: `{ "success": false, "message": <...>, "errors": <opsional> }`.
    - `message` pada response sukses hanya muncul jika backend mengisinya.
    - Error dari framework (401, 403, 404, 405, 422, 429) juga memakai envelope
      error di atas; lihat `bootstrap/app.php`.

    File ini adalah sumber kebenaran kontrak auth. Perubahan pada
    `routes/api/v1/auth.php` harus disertai pembaruan file ini.
  version: 0.4.0

tags:
  - name: System
    description: Health check dan diagnostik service.
  - name: Auth
    description: Registrasi, login, profil, dan logout karyawan.

servers:
  - url: http://localhost:8000
    description: Local development

paths:
  /api/v1/health:
    get:
      summary: Health check
      tags: [System]
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/login:
    post:
      summary: Login karyawan
      tags: [Auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              identifier: "karyawan@example.com"
              password: "rahasia123"
              device_name: "Android Pixel 7"
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
              example:
                success: true
                message: "Login berhasil."
                data:
                  token: "3|AbCdEf..."
                  token_type: "Bearer"
                  expires_at: "2026-11-27T10:00:00+00:00"
                  must_change_password: true
                  user:
                    id: 2
                    name: "Karyawan Contoh"
                    email: "karyawan@example.com"
                    role: "employee"
                    must_change_password: true
                    employee_number: null
                    employee: null
        '401':
          description: Kredensial salah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResource'
              example:
                success: false
                message: "Kredensial tidak valid."
        '422':
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResource'
              example:
                success: false
                message: "Validasi gagal."
                errors:
                  identifier: ["The identifier field is required when email is not present."]
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/invitations/{token}/password:
    post:
      summary: Buat kata sandi dari link undangan
      security: []
      description: |
        Dipakai karyawan yang menerima link undangan registrasi wajah. Link
        undangan adalah kredensialnya: endpoint ini publik (tanpa sesi),
        di-throttle 5 permintaan/menit, dan hanya berlaku selama undangan
        berstatus `pending`/`sent` serta belum kedaluwarsa.

        Endpoint ini menetapkan kata sandi permanen karyawan
        (`must_change_password = false`) dan langsung menerbitkan sesi, sehingga
        HR tidak perlu menyampaikan kata sandi sementara. Undangan tetap
        `pending`: accept undangan adalah langkah terpisah.
      tags: [Auth]
      operationId: setPasswordFromInvitation
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9]{16,64}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetInvitationPasswordRequest'
            example:
              new_password: "rahasiaBaru123"
              new_password_confirmation: "rahasiaBaru123"
      responses:
        '200':
          description: Kata sandi dibuat dan sesi diterbitkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
              example:
                success: true
                message: "Kata sandi berhasil dibuat. Lanjutkan registrasi wajah."
                data:
                  token: "4|AbCdEf..."
                  token_type: "Bearer"
                  expires_at: "2026-11-27T10:00:00+00:00"
                  must_change_password: false
                  user:
                    id: 2
                    name: "Karyawan Contoh"
                    email: "karyawan@example.com"
                    role: "employee"
                    must_change_password: false
                    employee_number: "HM-0251"
                    employee: null
        '404':
          description: Token undangan tidak dikenal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResource'
              example:
                success: false
                message: "Undangan tidak ditemukan."
                errors:
                  code: ["INVITATION_NOT_FOUND"]
        '409':
          description: Akun sudah memakai kata sandi permanen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResource'
              example:
                success: false
                message: "Kata sandi akun ini sudah pernah diganti. Silakan masuk dengan kata sandi Anda."
                errors:
                  code: ["INVITATION_PASSWORD_ALREADY_CHANGED"]
        '422':
          description: Undangan tidak aktif/kedaluwarsa atau validasi gagal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResource'
              example:
                success: false
                message: "Undangan sudah kedaluwarsa."
                errors:
                  invitation: ["Undangan sudah kedaluwarsa."]
                  code: ["INVITATION_EXPIRED"]
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/change-password:
    post:
      summary: Ganti kata sandi pengguna terautentikasi
      description: |
        Dipakai untuk mengganti password sementara (`must_change_password`)
        maupun mengganti password secara sukarela. Endpoint ini tetap dapat
        diakses selama `must_change_password = true`.
      tags: [Auth]
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              current_password: "R7$vQz2mKp9wXa4t"
              new_password: "rahasiaBaru123"
              new_password_confirmation: "rahasiaBaru123"
      responses:
        '200':
          description: Kata sandi berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordResponse'
              example:
                success: true
                message: "Kata sandi berhasil diperbarui."
                data:
                  must_change_password: false
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResource'
              example:
                success: false
                message: "Unauthenticated."
        '422':
          description: Kata sandi saat ini salah atau validasi gagal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResource'
              example:
                success: false
                message: "Kata sandi saat ini tidak sesuai."
                errors:
                  current_password: ["Kata sandi saat ini tidak sesuai."]
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/me:
    get:
      summary: Profil pengguna terautentikasi
      tags: [Auth]
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil pengguna
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
              example:
                success: true
                data:
                  id: 2
                  name: "Karyawan Contoh"
                  email: "karyawan@example.com"
                  role: "employee"
                  must_change_password: false
                  employee_number: "HM-0251"
                  employee:
                    id: 251
                    employee_number: "HM-0251"
                    full_name: "Putri Ramadhani"
                    work_email: "putri.r@sinarmetrik.co.id"
                    job_title: "Staf Admin Gudang"
                    division:
                      id: 1
                      name: "Operasional"
                    employment_status: "probation"
                    face_registered: false
                    face_registered_at: null
        '401':
          description: Tidak terautentikasi (token hilang/invalid/kadaluarsa)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResource'
              example:
                success: false
                message: "Unauthenticated."
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/me/profile:
    get:
      summary: Profil karyawan sendiri
      tags: [Auth]
      operationId: getMeProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil karyawan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
              example:
                success: true
                data:
                  employee:
                    id: 251
                    employee_number: "HM-0251"
                    full_name: "Putri Ramadhani"
                    work_email: "putri.r@sinarmetrik.co.id"
                    phone_e164: "+6281234567890"
                    division:
                      id: 1
                      name: "Operasional"
                    job_title: "Staf Admin Gudang"
                    manager:
                      id: 102
                      full_name: "Dimas Ardiansyah"
                      employee_number: "HM-0102"
                    employment_start: "2025-02-03"
                    employment_status: "probation"
                    face_registered_at: "2026-10-01T08:00:00Z"
                  compensation:
                    base_salary: "8500000.00"
                    transport_allowance: "550000.00"
                    meal_allowance: "660000.00"
                    total_monthly: "9710000.00"
                    currency: "IDR"
                  shift_assignment:
                    shift_id: 3
                    name: "Shift Pagi"
                    is_overnight: false
                    effective_from: "2026-10-01"
                  work_location_assignment:
                    work_location_id: 2
                    name: "Kantor Pusat Yogyakarta"
                    effective_from: "2026-10-01"
                  invitation:
                    id: 18
                    status: "accepted"
                    requested_channels: ["email"]
                    expires_at: "2026-11-01T08:00:00Z"
                    deliveries:
                      - channel: "email"
                        recipient: "putri.r@sinarmetrik.co.id"
                        status: "sent"
                  manager:
                    id: 102
                    full_name: "Dimas Ardiansyah"
                    employee_number: "HM-0102"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Pengguna masih memakai kata sandi sementara
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResource'
              example:
                success: false
                message: "Anda harus mengganti kata sandi sebelum mengakses fitur ini."
                errors:
                  code: ["PASSWORD_CHANGE_REQUIRED"]
        '404':
          description: Akun tidak terhubung dengan data karyawan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResource'
              example:
                success: false
                message: "Profil karyawan tidak ditemukan."
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      summary: Perbarui profil karyawan sendiri
      tags: [Auth]
      operationId: patchMeProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatchRequest'
            example:
              phone_e164: "+6281234567890"
              job_title: "Staf Senior Admin Gudang"
              division_id: 2
              work_email: "putri.r@sinarmetrik.co.id"
      responses:
        '200':
          description: Profil berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
              example:
                success: true
                message: "Profil berhasil diperbarui."
                data:
                  employee:
                    id: 251
                    employee_number: "HM-0251"
                    full_name: "Putri Ramadhani"
                    work_email: "putri.r@sinarmetrik.co.id"
                    phone_e164: "+6281234567890"
                    division:
                      id: 2
                      name: "Distribusi"
                    job_title: "Staf Senior Admin Gudang"
                    manager: null
                    employment_start: "2025-02-03"
                    employment_status: "probation"
                    face_registered_at: "2026-10-01T08:00:00Z"
                  compensation: null
                  shift_assignment: null
                  work_location_assignment: null
                  invitation: null
                  manager: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Pengguna masih memakai kata sandi sementara
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResource'
              example:
                success: false
                message: "Anda harus mengganti kata sandi sebelum mengakses fitur ini."
                errors:
                  code: ["PASSWORD_CHANGE_REQUIRED"]
        '422':
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResource'
              example:
                success: false
                message: "Validasi gagal."
                errors:
                  division_id: ["Divisi tidak aktif atau tidak ditemukan."]
                  work_email: ["Email sudah digunakan oleh karyawan lain."]
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/logout:
    post:
      summary: Logout — cabut token saat ini
      tags: [Auth]
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
              example:
                success: true
                message: "Logout berhasil."
                data: null
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResource'
              example:
                success: false
                message: "Unauthenticated."
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/notifications:
    get:
      summary: Daftar notifikasi in-app
      tags: [Notifications]
      operationId: listNotifications
      security: [{bearerAuth: []}]
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100}
      responses:
        '200':
          description: Inbox terbaru + jumlah belum dibaca
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    post:
      summary: Tandai semua notifikasi dibaca
      tags: [Notifications]
      operationId: readAllNotifications
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Jumlah yang ditandai
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReadAllNotificationsResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/notifications/{id}/read:
    post:
      summary: Tandai satu notifikasi dibaca
      tags: [Notifications]
      operationId: readNotification
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Notifikasi diperbarui
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReadNotificationResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/Unauthorized'}

  /api/v1/tasks:
    get:
      summary: Daftar tugas karyawan (assignment + ringkasan tugas)
      tags: [Tasks]
      operationId: listMyTasks
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Daftar tugas
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/tasks/{id}:
    get:
      summary: Detail tugas (assignment/submission/lampiran/komentar milik viewer)
      tags: [Tasks]
      operationId: getTask
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Detail tugas
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskDetailResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/tasks/{id}/start:
    post:
      summary: Mulai tugas
      tags: [Tasks]
      operationId: startTask
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Tugas dimulai
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskDetailResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/tasks/{id}/progress:
    patch:
      summary: Perbarui progres dan checklist
      tags: [Tasks]
      operationId: updateTaskProgress
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskProgressRequest'}
      responses:
        '200':
          description: Progres diperbarui
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskDetailResponse'}
  /api/v1/tasks/{id}/submissions:
    post:
      summary: Kirim tugas untuk penilaian (multipart, boleh lampiran bukti)
      tags: [Tasks]
      operationId: submitTask
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/TaskSubmitRequest'}
      responses:
        '201':
          description: Tugas diajukan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskSubmitResponse'}
  /api/v1/tasks/{id}/comments:
    post:
      summary: Tambah komentar tugas
      tags: [Tasks]
      operationId: addTaskComment
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskCommentRequest'}
      responses:
        '200':
          description: Komentar ditambahkan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskDetailResponse'}
  /api/v1/tasks/{id}/attachments:
    post:
      summary: Unggah lampiran/bukti tugas
      tags: [Tasks]
      operationId: uploadTaskAttachment
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                kind:
                  type: string
      responses:
        '200':
          description: Lampiran tersimpan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskDetailResponse'}
  /api/v1/tasks/{id}/attachments/{attachmentId}:
    get:
      summary: Unduh lampiran tugas (privat)
      tags: [Tasks]
      operationId: downloadTaskAttachment
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
        - name: attachmentId
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: File biner
          content:
            application/octet-stream:
              schema: {type: string, format: binary}

  /api/v1/hr/employees:
    get:
      summary: Daftar karyawan (HR)
      tags: [HR]
      operationId: listHrEmployees
      security: [{bearerAuth: []}]
      parameters:
        - name: search
          in: query
          schema: {type: string}
        - name: division_id
          in: query
          schema: {type: integer}
        - name: status
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Daftar karyawan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HrEmployeeListResponse'}
    post:
      summary: Buat karyawan + undangan (HR)
      tags: [HR]
      operationId: createHrEmployee
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateEmployeeRequest'}
      responses:
        '201':
          description: Karyawan dibuat
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreateEmployeeResponse'}
  /api/v1/hr/employees/create-options:
    get:
      summary: Opsi pembuatan karyawan (divisi, shift, lokasi)
      tags: [HR]
      operationId: getHrEmployeeOptions
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Opsi
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HrEmployeeOptionsResponse'}
  /api/v1/hr/employees/{id}:
    get:
      summary: Detail karyawan (HR)
      tags: [HR]
      operationId: getHrEmployee
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Detail karyawan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmployeeProfileResponse'}
  /api/v1/hr/employees/{id}/invitations:
    post:
      summary: Kirim ulang undangan karyawan
      tags: [HR]
      operationId: resendInvitation
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResendInvitationRequest'}
      responses:
        '201':
          description: Undangan baru
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvitationResponse'}
  /api/v1/hr/employees/{id}/reset-password:
    post:
      summary: Reset kata sandi sementara karyawan
      tags: [HR]
      operationId: resetEmployeePassword
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Password sementara dibuat
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResetPasswordResponse'}
  /api/v1/hr/invitations/{id}:
    delete:
      summary: Cabut undangan
      tags: [HR]
      operationId: revokeInvitation
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Undangan dicabut
          content:
