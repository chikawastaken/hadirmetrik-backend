components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: Token yang diterima dari endpoint /login.

  responses:
    Unauthorized:
      description: Tidak terautentikasi (token hilang, invalid, atau kadaluarsa).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResource'
          example:
            success: false
            message: "Unauthenticated."
    TooManyRequests:
      description: Terlalu banyak permintaan (rate limit `throttle:api`, 60/menit per user/IP).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResource'
          example:
            success: false
            message: "Too Many Attempts."

  schemas:
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: |
            Email ATAU `employee_number` (contoh `HM-0251`). Jika tidak
            mengandung `@`, backend mencocokkannya ke `employees.employee_number`.
          example: "HM-0251"
        email:
          type: string
          format: email
          deprecated: true
          description: Alias lama untuk `identifier`; dipertahankan sementara untuk kompatibilitas klien.
        password:
          type: string
          example: "rahasia123"
        device_name:
          type: string
          description: Nama perangkat untuk identifikasi token (opsional).
          example: "Android Pixel 7"

    AuthSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: [string, "null"]
          description: Pesan sukses; ada hanya jika backend mengisinya.
        data:
          type: object
          required: [token, token_type, expires_at, must_change_password, user]
          properties:
            token:
              type: string
              description: Sanctum personal access token.
            token_type:
              type: string
              example: "Bearer"
            expires_at:
              type: [string, "null"]
              format: date-time
              description: >
                Waktu kedaluwarsa token (default 7 hari, `SANCTUM_EXPIRATION`).
                Klien menyimpan nilai ini dan meminta login ulang setelah lewat;
                `null` berarti token tidak memiliki kedaluwarsa eksplisit.
            must_change_password:
              type: boolean
              description: Jika `true`, klien wajib mengarahkan pengguna ke halaman ganti password.
            user:
              $ref: '#/components/schemas/UserProfile'

    UserProfile:
      type: object
      required: [id, name, email, role, must_change_password, employee_number, employee]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [hr, employee]
        must_change_password:
          type: boolean
        employee_number:
          type: [string, "null"]
          description: Nomor karyawan; `null` untuk akun non-karyawan.
        employee:
          description: |
            Ringkasan karyawan. Login hanya mengembalikan `null`; `GET /me`
            mengisinya untuk akun yang terhubung ke record employee.
          oneOf:
            - $ref: '#/components/schemas/EmployeeSummary'
            - type: "null"

    EmployeeSummary:
      type: object
      required:
        - id
        - employee_number
        - full_name
        - work_email
        - job_title
        - division
        - employment_status
        - face_registered
        - face_registered_at
      properties:
        id:
          type: integer
        employee_number:
          type: string
          example: "HM-0251"
        full_name:
          type: string
        work_email:
          type: string
          format: email
        job_title:
          type: [string, "null"]
        division:
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id:
                  type: integer
                name:
                  type: string
            - type: "null"
        employment_status:
          type: string
          enum: [probation, active, contract, terminated]
        face_registered:
          type: boolean
          description: "`true` bila sudah ada template wajah aktif."
        face_registered_at:
          type: [string, "null"]
          format: date-time

    MeResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/UserProfile'

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password, new_password_confirmation]
      properties:
        current_password:
          type: string
          example: "R7$vQz2mKp9wXa4t"
        new_password:
          type: string
          minLength: 8
          description: Minimal 8 karakter dan harus berbeda dari password saat ini.
          example: "rahasiaBaru123"
        new_password_confirmation:
          type: string
          description: Harus sama dengan `new_password`.
          example: "rahasiaBaru123"

    SetInvitationPasswordRequest:
      type: object
      required: [new_password, new_password_confirmation]
      properties:
        new_password:
          type: string
          minLength: 8
          description: Kata sandi permanen baru, minimal 8 karakter.
          example: "rahasiaBaru123"
        new_password_confirmation:
          type: string
          description: Harus sama dengan `new_password`.
          example: "rahasiaBaru123"

    ChangePasswordResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: [string, "null"]
        data:
          type: object
          required: [must_change_password]
          properties:
            must_change_password:
              type: boolean
              example: false

    ProfilePatchRequest:
      type: object
      properties:
        phone_e164:
          type: [string, "null"]
          description: Nomor telepon E.164 (contoh +6281234567890).
          pattern: '^\+[1-9]\d{1,14}$'
          maxLength: 20
        job_title:
          type: [string, "null"]
          description: Jabatan pekerjaan.
          maxLength: 100
        division_id:
          type: [integer, "null"]
          description: ID divisi aktif. Divisi nonaktif ditolak 422.
        work_email:
          type: [string, "null"]
          format: email
          description: Email kerja (unik di tabel employees, harus huruf kecil).
          maxLength: 255

    ProfileResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: [string, "null"]
        data:
          type: object
          required: [employee]
          properties:
            employee:
              $ref: '#/components/schemas/EmployeeProfileData'
            compensation:
              oneOf:
                - $ref: '#/components/schemas/CompensationData'
                - type: "null"
            shift_assignment:
              oneOf:
                - $ref: '#/components/schemas/ShiftAssignmentData'
                - type: "null"
            work_location_assignment:
              oneOf:
                - $ref: '#/components/schemas/WorkLocationAssignmentData'
                - type: "null"
            invitation:
              oneOf:
                - $ref: '#/components/schemas/InvitationData'
                - type: "null"
            manager:
              oneOf:
                - $ref: '#/components/schemas/EmployeeManagerData'
                - type: "null"

    EmployeeManagerData:
      type: object
      required: [id, full_name, employee_number]
      properties:
        id:
          type: integer
        full_name:
          type: string
        employee_number:
          type: string
          example: "HM-0102"

    EmployeeProfileData:
      type: object
      required:
        - id
        - employee_number
        - full_name
        - work_email
        - phone_e164
        - division
        - job_title
        - manager
        - employment_start
        - employment_status
        - face_registered_at
      properties:
        id:
          type: integer
        employee_number:
          type: string
        full_name:
          type: string
        work_email:
          type: string
          format: email
        phone_e164:
          type: [string, "null"]
          example: "+6281234567890"
        division:
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id:
                  type: integer
                name:
                  type: string
            - type: "null"
        job_title:
          type: [string, "null"]
        manager:
          oneOf:
            - $ref: '#/components/schemas/EmployeeManagerData'
            - type: "null"
        employment_start:
          type: [string, "null"]
          format: date
          example: "2025-02-03"
        employment_status:
          type: string
          description: Status kepegawaian dari `employees.employment_status`.
          example: "probation"
        face_registered_at:
          type: [string, "null"]
          format: date-time

    CompensationData:
      type: object
      description: Nilai desimal dikirim sebagai string agar presisi tidak hilang.
      properties:
        base_salary:
          type: string
          example: "8500000.00"
        transport_allowance:
          type: string
          example: "550000.00"
        meal_allowance:
          type: string
          example: "660000.00"
        total_monthly:
          type: string
          example: "9710000.00"
        currency:
          type: string
          example: "IDR"

    ShiftAssignmentData:
      type: object
      properties:
        shift_id:
          type: integer
        name:
          type: string
          example: "Shift Pagi"
        is_overnight:
          type: boolean
        effective_from:
          type: string
          format: date

    WorkLocationAssignmentData:
      type: object
      properties:
        work_location_id:
          type: integer
        name:
          type: string
          example: "Kantor Pusat Yogyakarta"
        effective_from:
          type: string
          format: date

    InvitationData:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
          description: Status undangan, mis. `pending`, `sent`, `accepted`, `expired`, `revoked`.
          example: "accepted"
        requested_channels:
          type: array
          items:
            type: string
          example: ["email"]
        expires_at:
          type: string
          format: date-time
        deliveries:
          type: array
          items:
            type: object
            properties:
              channel:
                type: string
                example: "email"
              recipient:
                type: string
                example: "putri.r@sinarmetrik.co.id"
              status:
                type: string
                description: Status pengiriman, mis. `queued`, `sent`, `failed`.
                example: "sent"


    NotificationListResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, example: true}
        data:
          type: object
          properties:
            notifications:
              type: array
              items: {$ref: '#/components/schemas/Notification'}
            unread_count: {type: integer}
    ReadNotificationResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, example: true}
        data:
          type: object
          properties:
            notification:
              type: object
              properties:
                id: {type: integer}
                read_at: {type: [string, "null"], format: date-time}
    ReadAllNotificationsResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, example: true}
        data:
          type: object
          properties:
            updated: {type: integer}
    Notification:
      type: object
      properties:
        id: {type: integer}
        category: {type: string}
        title: {type: string}
        body: {type: [string, "null"]}
        read_at: {type: [string, "null"], format: date-time}
        push_status: {type: string}
        created_at: {type: [string, "null"], format: date-time}

    TaskListResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, example: true}
        data:
          type: object
          properties:
            tasks:
              type: array
              items:
                type: object
                properties:
                  assignment: {$ref: '#/components/schemas/TaskAssignment'}
                  task: {$ref: '#/components/schemas/TaskSummary'}
    TaskDetailResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, example: true}
        message: {type: [string, "null"]}
        data:
          type: object
          properties:
            task: {$ref: '#/components/schemas/TaskDetail'}
    TaskProgressRequest:
      type: object
      required: [progress_percent]
      properties:
        progress_percent: {type: integer, minimum: 0, maximum: 100}
        checklist:
          type: array
          items: {$ref: '#/components/schemas/ChecklistItem'}
    TaskSubmitRequest:
      type: object
      properties:
        note: {type: string, maxLength: 2000}
        checklist:
          type: array
          items: {$ref: '#/components/schemas/ChecklistItem'}
        attachment_ids:
          type: array
          items: {type: integer}
        evidence:
          type: array
          items: {type: string, format: binary}
    TaskCommentRequest:
      type: object
      required: [body]
      properties:
        body: {type: string}
    TaskSubmitResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, example: true}
        message: {type: [string, "null"]}
        data:
          type: object
          properties:
            task: {$ref: '#/components/schemas/TaskDetail'}
            submission: {$ref: '#/components/schemas/TaskSubmission'}
    TaskSummary:
      type: object
      properties:
        id: {type: integer}
        title: {type: string}
        description: {type: [string, "null"]}
        priority: {type: string, enum: [high, medium, low]}
        status: {type: string}
        requires_photo_proof: {type: boolean}
        division_id: {type: [integer, "null"]}
        created_by: {type: integer}
        due_at: {type: [string, "null"], format: date-time}
        cancelled_at: {type: [string, "null"], format: date-time}
        created_at: {type: [string, "null"], format: date-time}
    TaskDetail:
      allOf:
        - $ref: '#/components/schemas/TaskSummary'
        - type: object
          properties:
            checklist_template:
              type: array
              items: {$ref: '#/components/schemas/ChecklistItem'}
            assignments:
              type: array
              items: {$ref: '#/components/schemas/TaskAssignment'}
            submissions:
              type: array
              items: {$ref: '#/components/schemas/TaskSubmission'}
            attachments:
              type: array
              items: {$ref: '#/components/schemas/TaskAttachment'}
            comments:
              type: array
              items: {$ref: '#/components/schemas/TaskComment'}
    TaskAssignment:
      type: object
      properties:
        id: {type: integer}
        task_id: {type: integer}
        employee_id: {type: integer}
        employee_name: {type: [string, "null"]}
        status: {type: string}
        progress_percent: {type: integer}
        checklist:
          type: array
          items: {$ref: '#/components/schemas/ChecklistItem'}
        assigned_at: {type: [string, "null"], format: date-time}
        started_at: {type: [string, "null"], format: date-time}
        completed_at: {type: [string, "null"], format: date-time}
    TaskSubmission:
      type: object
      properties:
        id: {type: integer}
        task_assignment_id: {type: integer}
        note: {type: [string, "null"]}
        checklist:
          type: array
          items: {$ref: '#/components/schemas/ChecklistItem'}
        review_status: {type: string}
        review_rating: {type: [integer, "null"]}
        review_note: {type: [string, "null"]}
        submitted_at: {type: [string, "null"], format: date-time}
        reviewed_at: {type: [string, "null"], format: date-time}
    TaskAttachment:
      type: object
      properties:
        id: {type: integer}
        task_submission_id: {type: [integer, "null"]}
        kind: {type: string}
        original_name: {type: string}
        mime_type: {type: string}
        size_bytes: {type: integer}
        created_at: {type: [string, "null"], format: date-time}
    TaskComment:
      type: object
      properties:
        id: {type: integer}
        author_user_id: {type: integer}
        author_name: {type: [string, "null"]}
        body: {type: string}
        created_at: {type: [string, "null"], format: date-time}
    ChecklistItem:
      type: object
      properties:
        key: {type: string}
        label: {type: string}
        done: {type: boolean}

    CreateTaskRequest:
      type: object
      required: [title, assignee_ids]
      properties:
        title: {type: string, minLength: 5}
        description: {type: string}
        priority: {type: string, enum: [high, medium, low]}
        assignee_ids:
          type: array
          items: {type: integer}
        requires_photo_proof: {type: boolean}
        checklist_template:
          type: array
          items: {$ref: '#/components/schemas/ChecklistItem'}
        due_at: {type: string, format: date-time}
        division_id: {type: integer}
    TaskOptionsResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, example: true}
        data:
          type: object
          properties:
            priorities:
              type: array
              items:
                type: object
                properties:
                  value: {type: string}
                  label: {type: string}
    HrTaskListResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, example: true}
        data:
          type: object
          properties:
            tasks:
              type: array
              items:
                type: object
                properties:
                  id: {type: integer}
                  title: {type: string}
                  description: {type: [string, "null"]}
                  priority: {type: string}
                  status: {type: string}
                  requires_photo_proof: {type: boolean}
                  division_id: {type: [integer, "null"]}
                  created_by: {type: integer}
                  due_at: {type: [string, "null"], format: date-time}
                  cancelled_at: {type: [string, "null"], format: date-time}
                  created_at: {type: [string, "null"], format: date-time}
                  assignments:
                    type: array
                    items: {$ref: '#/components/schemas/TaskAssignment'}
            meta:
              type: object
              properties:
                current_page: {type: integer}
                per_page: {type: integer}
                last_page: {type: integer}
                total: {type: integer}
    TaskReviewRequest:
      type: object
      required: [decision]
