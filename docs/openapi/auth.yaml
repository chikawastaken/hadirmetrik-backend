openapi: 3.1.0
info:
  title: HadirMetrik API — Auth
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    Kontrak endpoint minimum untuk autentikasi yang dipakai bersama oleh
    developer backend Laravel dan developer mobile Flutter.

    Aturan kontrak:

    - Semua endpoint berada di bawah prefix `/api/v1`.
    - Semua request dan response berformat JSON (`Accept: application/json`).
    - Endpoint terproteksi memakai header `Authorization: Bearer <token>`.
    - Response sukses: `{ "success": true, "data": <...>, "message": <opsional> }`.
    - Response error: `{ "success": false, "message": <...>, "errors": <opsional> }`.
    - `message` pada response sukses hanya muncul jika backend mengisinya.
    - Error dari framework (401, 403, 404, 405, 422, 429) juga memakai envelope
      error di atas; lihat `bootstrap/app.php`.

    File ini adalah sumber kebenaran kontrak auth. Perubahan pada
    `routes/api/v1/auth.php` harus disertai pembaruan file ini.
  version: 0.4.0

tags:
  - name: System
    description: Health check dan diagnostik service.
  - name: Auth
    description: Registrasi, login, profil, dan logout karyawan.

servers:
  - url: http://localhost:8000
    description: Local development
  - url: https://api.hadirmetrik.local
    description: Production (placeholder)

paths:
  /api/v1/health:
    get:
      summary: Health check
      tags: [System]
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/login:
    post:
      summary: Login karyawan
      tags: [Auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              identifier: "karyawan@example.com"
              password: "rahasia123"
              device_name: "Android Pixel 7"
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
              example:
                success: true
                message: "Login berhasil."
                data:
                  token: "3|AbCdEf..."
                  token_type: "Bearer"
                  expires_at: "2026-11-27T10:00:00+00:00"
                  must_change_password: true
                  user:
                    id: 2
                    name: "Karyawan Contoh"
                    email: "karyawan@example.com"
                    role: "employee"
                    must_change_password: true
                    employee_number: null
                    employee: null
        '401':
          description: Kredensial salah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResource'
              example:
                success: false
                message: "Kredensial tidak valid."
        '422':
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResource'
              example:
                success: false
                message: "Validasi gagal."
                errors:
                  identifier: ["The identifier field is required when email is not present."]
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/invitations/{token}/password:
    post:
      summary: Buat kata sandi dari link undangan
      security: []
      description: |
        Dipakai karyawan yang menerima link undangan registrasi wajah. Link
        undangan adalah kredensialnya: endpoint ini publik (tanpa sesi),
        di-throttle 5 permintaan/menit, dan hanya berlaku selama undangan
        berstatus `pending`/`sent` serta belum kedaluwarsa.

        Endpoint ini menetapkan kata sandi permanen karyawan
        (`must_change_password = false`) dan langsung menerbitkan sesi, sehingga
        HR tidak perlu menyampaikan kata sandi sementara. Undangan tetap
        `pending`: accept undangan adalah langkah terpisah.
      tags: [Auth]
      operationId: setPasswordFromInvitation
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9]{16,64}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetInvitationPasswordRequest'
            example:
              new_password: "rahasiaBaru123"
              new_password_confirmation: "rahasiaBaru123"
      responses:
        '200':
          description: Kata sandi dibuat dan sesi diterbitkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
              example:
                success: true
                message: "Kata sandi berhasil dibuat. Lanjutkan registrasi wajah."
                data:
                  token: "4|AbCdEf..."
                  token_type: "Bearer"
                  expires_at: "2026-11-27T10:00:00+00:00"
                  must_change_password: false
                  user:
                    id: 2
                    name: "Karyawan Contoh"
                    email: "karyawan@example.com"
                    role: "employee"
                    must_change_password: false
                    employee_number: "HM-0251"
                    employee: null
        '404':
          description: Token undangan tidak dikenal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResource'
              example:
                success: false
                message: "Undangan tidak ditemukan."
                errors:
                  code: ["INVITATION_NOT_FOUND"]
        '409':
          description: Akun sudah memakai kata sandi permanen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResource'
              example:
                success: false
                message: "Kata sandi akun ini sudah pernah diganti. Silakan masuk dengan kata sandi Anda."
                errors:
                  code: ["INVITATION_PASSWORD_ALREADY_CHANGED"]
        '422':
          description: Undangan tidak aktif/kedaluwarsa atau validasi gagal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResource'
              example:
                success: false
                message: "Undangan sudah kedaluwarsa."
                errors:
                  invitation: ["Undangan sudah kedaluwarsa."]
                  code: ["INVITATION_EXPIRED"]
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/change-password:
    post:
      summary: Ganti kata sandi pengguna terautentikasi
      description: |
        Dipakai untuk mengganti password sementara (`must_change_password`)
        maupun mengganti password secara sukarela. Endpoint ini tetap dapat
        diakses selama `must_change_password = true`.
      tags: [Auth]
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              current_password: "R7$vQz2mKp9wXa4t"
              new_password: "rahasiaBaru123"
              new_password_confirmation: "rahasiaBaru123"
      responses:
        '200':
          description: Kata sandi berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordResponse'
              example:
                success: true
                message: "Kata sandi berhasil diperbarui."
                data:
                  must_change_password: false
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResource'
              example:
                success: false
                message: "Unauthenticated."
        '422':
          description: Kata sandi saat ini salah atau validasi gagal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResource'
              example:
                success: false
                message: "Kata sandi saat ini tidak sesuai."
                errors:
                  current_password: ["Kata sandi saat ini tidak sesuai."]
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/me:
    get:
      summary: Profil pengguna terautentikasi
      tags: [Auth]
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil pengguna
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
              example:
                success: true
                data:
                  id: 2
                  name: "Karyawan Contoh"
                  email: "karyawan@example.com"
                  role: "employee"
                  must_change_password: false
                  employee_number: "HM-0251"
                  employee:
                    id: 251
                    employee_number: "HM-0251"
                    full_name: "Putri Ramadhani"
                    work_email: "putri.r@sinarmetrik.co.id"
                    job_title: "Staf Admin Gudang"
                    division:
                      id: 1
                      name: "Operasional"
                    employment_status: "probation"
                    face_registered: false
                    face_registered_at: null
        '401':
          description: Tidak terautentikasi (token hilang/invalid/kadaluarsa)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResource'
              example:
                success: false
                message: "Unauthenticated."
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/me/profile:
    get:
      summary: Profil karyawan sendiri
      tags: [Auth]
      operationId: getMeProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil karyawan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
              example:
                success: true
                data:
                  employee:
                    id: 251
                    employee_number: "HM-0251"
                    full_name: "Putri Ramadhani"
                    work_email: "putri.r@sinarmetrik.co.id"
                    phone_e164: "+6281234567890"
                    division:
                      id: 1
                      name: "Operasional"
                    job_title: "Staf Admin Gudang"
                    manager:
                      id: 102
                      full_name: "Dimas Ardiansyah"
                      employee_number: "HM-0102"
                    employment_start: "2025-02-03"
                    employment_status: "probation"
                    face_registered_at: "2026-10-01T08:00:00Z"
                  compensation:
                    base_salary: "8500000.00"
                    transport_allowance: "550000.00"
                    meal_allowance: "660000.00"
                    total_monthly: "9710000.00"
                    currency: "IDR"
                  shift_assignment:
                    shift_id: 3
                    name: "Shift Pagi"
                    is_overnight: false
                    effective_from: "2026-10-01"
                  work_location_assignment:
                    work_location_id: 2
                    name: "Kantor Pusat Yogyakarta"
                    effective_from: "2026-10-01"
                  invitation:
                    id: 18
                    status: "accepted"
                    requested_channels: ["email"]
                    expires_at: "2026-11-01T08:00:00Z"
                    deliveries:
                      - channel: "email"
                        recipient: "putri.r@sinarmetrik.co.id"
                        status: "sent"
                  manager:
                    id: 102
                    full_name: "Dimas Ardiansyah"
                    employee_number: "HM-0102"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Pengguna masih memakai kata sandi sementara
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResource'
              example:
                success: false
                message: "Anda harus mengganti kata sandi sebelum mengakses fitur ini."
                errors:
                  code: ["PASSWORD_CHANGE_REQUIRED"]
        '404':
          description: Akun tidak terhubung dengan data karyawan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResource'
              example:
                success: false
                message: "Profil karyawan tidak ditemukan."
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      summary: Perbarui profil karyawan sendiri
      tags: [Auth]
      operationId: patchMeProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatchRequest'
            example:
              phone_e164: "+6281234567890"
              job_title: "Staf Senior Admin Gudang"
              division_id: 2
              work_email: "putri.r@sinarmetrik.co.id"
      responses:
        '200':
          description: Profil berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
              example:
                success: true
                message: "Profil berhasil diperbarui."
                data:
                  employee:
                    id: 251
                    employee_number: "HM-0251"
                    full_name: "Putri Ramadhani"
                    work_email: "putri.r@sinarmetrik.co.id"
                    phone_e164: "+6281234567890"
                    division:
                      id: 2
                      name: "Distribusi"
                    job_title: "Staf Senior Admin Gudang"
                    manager: null
                    employment_start: "2025-02-03"
                    employment_status: "probation"
                    face_registered_at: "2026-10-01T08:00:00Z"
                  compensation: null
                  shift_assignment: null
                  work_location_assignment: null
                  invitation: null
                  manager: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Pengguna masih memakai kata sandi sementara
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResource'
              example:
                success: false
                message: "Anda harus mengganti kata sandi sebelum mengakses fitur ini."
                errors:
                  code: ["PASSWORD_CHANGE_REQUIRED"]
        '422':
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResource'
              example:
                success: false
                message: "Validasi gagal."
                errors:
                  division_id: ["Divisi tidak aktif atau tidak ditemukan."]
                  work_email: ["Email sudah digunakan oleh karyawan lain."]
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/logout:
    post:
      summary: Logout — cabut token saat ini
      tags: [Auth]
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
              example:
                success: true
                message: "Logout berhasil."
                data: null
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResource'
              example:
                success: false
                message: "Unauthenticated."
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: Token yang diterima dari endpoint /login.

  responses:
    Unauthorized:
      description: Tidak terautentikasi (token hilang, invalid, atau kadaluarsa).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResource'
          example:
            success: false
            message: "Unauthenticated."
    TooManyRequests:
      description: Terlalu banyak permintaan (rate limit `throttle:api`, 60/menit per user/IP).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResource'
          example:
            success: false
            message: "Too Many Attempts."

  schemas:
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: |
            Email ATAU `employee_number` (contoh `HM-0251`). Jika tidak
            mengandung `@`, backend mencocokkannya ke `employees.employee_number`.
          example: "HM-0251"
        email:
          type: string
          format: email
          deprecated: true
          description: Alias lama untuk `identifier`; dipertahankan sementara untuk kompatibilitas klien.
        password:
          type: string
          example: "rahasia123"
        device_name:
          type: string
          description: Nama perangkat untuk identifikasi token (opsional).
          example: "Android Pixel 7"

    AuthSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: [string, "null"]
          description: Pesan sukses; ada hanya jika backend mengisinya.
        data:
          type: object
          required: [token, token_type, expires_at, must_change_password, user]
          properties:
            token:
              type: string
              description: Sanctum personal access token.
            token_type:
              type: string
              example: "Bearer"
            expires_at:
              type: [string, "null"]
              format: date-time
              description: >
                Waktu kedaluwarsa token (default 7 hari, `SANCTUM_EXPIRATION`).
                Klien menyimpan nilai ini dan meminta login ulang setelah lewat;
                `null` berarti token tidak memiliki kedaluwarsa eksplisit.
            must_change_password:
              type: boolean
              description: Jika `true`, klien wajib mengarahkan pengguna ke halaman ganti password.
            user:
              $ref: '#/components/schemas/UserProfile'

    UserProfile:
      type: object
      required: [id, name, email, role, must_change_password, employee_number, employee]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [hr, employee]
        must_change_password:
          type: boolean
        employee_number:
          type: [string, "null"]
          description: Nomor karyawan; `null` untuk akun non-karyawan.
        employee:
          description: |
            Ringkasan karyawan. Login hanya mengembalikan `null`; `GET /me`
            mengisinya untuk akun yang terhubung ke record employee.
          oneOf:
            - $ref: '#/components/schemas/EmployeeSummary'
            - type: "null"

    EmployeeSummary:
      type: object
      required:
        - id
        - employee_number
        - full_name
        - work_email
        - job_title
        - division
        - employment_status
        - face_registered
        - face_registered_at
      properties:
        id:
          type: integer
        employee_number:
          type: string
          example: "HM-0251"
        full_name:
          type: string
        work_email:
          type: string
          format: email
        job_title:
          type: [string, "null"]
        division:
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id:
                  type: integer
                name:
                  type: string
            - type: "null"
        employment_status:
          type: string
          enum: [probation, active, contract, terminated]
        face_registered:
          type: boolean
          description: "`true` bila sudah ada template wajah aktif."
        face_registered_at:
          type: [string, "null"]
          format: date-time

    MeResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/UserProfile'

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password, new_password_confirmation]
      properties:
        current_password:
          type: string
          example: "R7$vQz2mKp9wXa4t"
        new_password:
          type: string
          minLength: 8
          description: Minimal 8 karakter dan harus berbeda dari password saat ini.
          example: "rahasiaBaru123"
        new_password_confirmation:
          type: string
          description: Harus sama dengan `new_password`.
          example: "rahasiaBaru123"

    SetInvitationPasswordRequest:
      type: object
      required: [new_password, new_password_confirmation]
      properties:
        new_password:
          type: string
          minLength: 8
          description: Kata sandi permanen baru, minimal 8 karakter.
          example: "rahasiaBaru123"
        new_password_confirmation:
          type: string
          description: Harus sama dengan `new_password`.
          example: "rahasiaBaru123"

    ChangePasswordResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: [string, "null"]
        data:
          type: object
          required: [must_change_password]
          properties:
            must_change_password:
              type: boolean
              example: false

    ProfilePatchRequest:
      type: object
      properties:
        phone_e164:
          type: [string, "null"]
          description: Nomor telepon E.164 (contoh +6281234567890).
          pattern: '^\+[1-9]\d{1,14}$'
          maxLength: 20
        job_title:
          type: [string, "null"]
          description: Jabatan pekerjaan.
          maxLength: 100
        division_id:
          type: [integer, "null"]
          description: ID divisi aktif. Divisi nonaktif ditolak 422.
        work_email:
          type: [string, "null"]
          format: email
          description: Email kerja (unik di tabel employees, harus huruf kecil).
          maxLength: 255

    ProfileResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: [string, "null"]
        data:
          type: object
          required: [employee]
          properties:
            employee:
              $ref: '#/components/schemas/EmployeeProfileData'
            compensation:
              oneOf:
                - $ref: '#/components/schemas/CompensationData'
                - type: "null"
            shift_assignment:
              oneOf:
                - $ref: '#/components/schemas/ShiftAssignmentData'
                - type: "null"
            work_location_assignment:
              oneOf:
                - $ref: '#/components/schemas/WorkLocationAssignmentData'
                - type: "null"
            invitation:
              oneOf:
                - $ref: '#/components/schemas/InvitationData'
                - type: "null"
            manager:
              oneOf:
                - $ref: '#/components/schemas/EmployeeManagerData'
                - type: "null"

    EmployeeManagerData:
      type: object
      required: [id, full_name, employee_number]
      properties:
        id:
          type: integer
        full_name:
          type: string
        employee_number:
          type: string
          example: "HM-0102"

    EmployeeProfileData:
      type: object
      required:
        - id
        - employee_number
        - full_name
        - work_email
        - phone_e164
        - division
        - job_title
        - manager
        - employment_start
        - employment_status
        - face_registered_at
      properties:
        id:
          type: integer
        employee_number:
          type: string
        full_name:
          type: string
        work_email:
          type: string
          format: email
        phone_e164:
          type: [string, "null"]
          example: "+6281234567890"
        division:
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id:
                  type: integer
                name:
                  type: string
            - type: "null"
        job_title:
          type: [string, "null"]
        manager:
          oneOf:
            - $ref: '#/components/schemas/EmployeeManagerData'
            - type: "null"
        employment_start:
          type: [string, "null"]
          format: date
          example: "2025-02-03"
        employment_status:
          type: string
          description: Status kepegawaian dari `employees.employment_status`.
          example: "probation"
        face_registered_at:
          type: [string, "null"]
          format: date-time

    CompensationData:
      type: object
      description: Nilai desimal dikirim sebagai string agar presisi tidak hilang.
      properties:
        base_salary:
          type: string
          example: "8500000.00"
        transport_allowance:
          type: string
          example: "550000.00"
        meal_allowance:
          type: string
          example: "660000.00"
        total_monthly:
          type: string
          example: "9710000.00"
        currency:
          type: string
          example: "IDR"

    ShiftAssignmentData:
      type: object
      properties:
        shift_id:
          type: integer
        name:
          type: string
