openapi: 3.1.0
info:
  title: HadirMetrik API — Auth
  description: |
    Kontrak endpoint minimum untuk autentikasi yang dipakai bersama oleh
    developer backend Laravel dan developer mobile Flutter.

    Aturan kontrak:

    - Semua endpoint berada di bawah prefix `/api/v1`.
    - Semua request dan response berformat JSON (`Accept: application/json`).
    - Endpoint terproteksi memakai header `Authorization: Bearer <token>`.
    - Response sukses: `{ "success": true, "data": <...>, "message": <opsional> }`.
    - Response error: `{ "success": false, "message": <...>, "errors": <opsional> }`.
    - `message` pada response sukses hanya muncul jika backend mengisinya.
    - Error dari framework (401, 403, 404, 405, 422, 429) juga memakai envelope
      error di atas; lihat `bootstrap/app.php`.

    File ini adalah sumber kebenaran kontrak auth. Perubahan pada
    `routes/api/v1/auth.php` harus disertai pembaruan file ini.
  version: 0.3.0

tags:
  - name: System
    description: Health check dan diagnostik service.
  - name: Auth
    description: Registrasi, login, profil, dan logout karyawan.

servers:
  - url: http://localhost:8000
    description: Local development
  - url: https://api.hadirmetrik.local
    description: Production (placeholder)

paths:
  /api/v1/health:
    get:
      summary: Health check
      tags: [System]
      operationId: getHealth
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/login:
    post:
      summary: Login karyawan
      tags: [Auth]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              identifier: "karyawan@example.com"
              password: "rahasia123"
              device_name: "Android Pixel 7"
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
              example:
                success: true
                message: "Login berhasil."
                data:
                  token: "3|AbCdEf..."
                  token_type: "Bearer"
                  must_change_password: true
                  user:
                    id: 2
                    name: "Karyawan Contoh"
                    email: "karyawan@example.com"
                    role: "employee"
                    must_change_password: true
                    employee_number: null
                    employee: null
        '401':
          description: Kredensial salah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResource'
              example:
                success: false
                message: "Kredensial tidak valid."
        '422':
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResource'
              example:
                success: false
                message: "Validasi gagal."
                errors:
                  identifier: ["The identifier field is required when email is not present."]
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/invitations/{token}/password:
    post:
      summary: Buat kata sandi dari link undangan
      description: |
        Dipakai karyawan yang menerima link undangan registrasi wajah. Link
        undangan adalah kredensialnya: endpoint ini publik (tanpa sesi),
        di-throttle 5 permintaan/menit, dan hanya berlaku selama undangan
        berstatus `pending`/`sent` serta belum kedaluwarsa.

        Endpoint ini menetapkan kata sandi permanen karyawan
        (`must_change_password = false`) dan langsung menerbitkan sesi, sehingga
        HR tidak perlu menyampaikan kata sandi sementara. Undangan tetap
        `pending`: accept undangan adalah langkah terpisah.
      tags: [Auth]
      operationId: setPasswordFromInvitation
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9]{16,64}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetInvitationPasswordRequest'
            example:
              new_password: "rahasiaBaru123"
              new_password_confirmation: "rahasiaBaru123"
      responses:
        '200':
          description: Kata sandi dibuat dan sesi diterbitkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
              example:
                success: true
                message: "Kata sandi berhasil dibuat. Lanjutkan registrasi wajah."
                data:
                  token: "4|AbCdEf..."
                  token_type: "Bearer"
                  must_change_password: false
                  user:
                    id: 2
                    name: "Karyawan Contoh"
                    email: "karyawan@example.com"
                    role: "employee"
                    must_change_password: false
                    employee_number: "HM-0251"
                    employee: null
        '404':
          description: Token undangan tidak dikenal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResource'
              example:
                success: false
                message: "Undangan tidak ditemukan."
                errors:
                  code: ["INVITATION_NOT_FOUND"]
        '409':
          description: Akun sudah memakai kata sandi permanen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResource'
              example:
                success: false
                message: "Kata sandi akun ini sudah pernah diganti. Silakan masuk dengan kata sandi Anda."
                errors:
                  code: ["INVITATION_PASSWORD_ALREADY_CHANGED"]
        '422':
          description: Undangan tidak aktif/kedaluwarsa atau validasi gagal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResource'
              example:
                success: false
                message: "Undangan sudah kedaluwarsa."
                errors:
                  invitation: ["Undangan sudah kedaluwarsa."]
                  code: ["INVITATION_EXPIRED"]
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/change-password:
    post:
      summary: Ganti kata sandi pengguna terautentikasi
      description: |
        Dipakai untuk mengganti password sementara (`must_change_password`)
        maupun mengganti password secara sukarela. Endpoint ini tetap dapat
        diakses selama `must_change_password = true`.
      tags: [Auth]
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              current_password: "R7$vQz2mKp9wXa4t"
              new_password: "rahasiaBaru123"
              new_password_confirmation: "rahasiaBaru123"
      responses:
        '200':
          description: Kata sandi berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordResponse'
              example:
                success: true
                message: "Kata sandi berhasil diperbarui."
                data:
                  must_change_password: false
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResource'
              example:
                success: false
                message: "Unauthenticated."
        '422':
          description: Kata sandi saat ini salah atau validasi gagal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResource'
              example:
                success: false
                message: "Kata sandi saat ini tidak sesuai."
                errors:
                  current_password: ["Kata sandi saat ini tidak sesuai."]
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/me:
    get:
      summary: Profil pengguna terautentikasi
      tags: [Auth]
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil pengguna
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
              example:
                success: true
                data:
                  id: 2
                  name: "Karyawan Contoh"
                  email: "karyawan@example.com"
                  role: "employee"
                  must_change_password: false
                  employee_number: "HM-0251"
                  employee:
                    id: 251
                    employee_number: "HM-0251"
                    full_name: "Putri Ramadhani"
                    work_email: "putri.r@sinarmetrik.co.id"
                    job_title: "Staf Admin Gudang"
                    division:
                      id: 1
                      name: "Operasional"
                    employment_status: "probation"
                    face_registered: false
                    face_registered_at: null
        '401':
          description: Tidak terautentikasi (token hilang/invalid/kadaluarsa)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResource'
              example:
                success: false
                message: "Unauthenticated."
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/logout:
    post:
      summary: Logout — cabut token saat ini
      tags: [Auth]
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
              example:
                success: true
                message: "Logout berhasil."
                data: null
        '401':
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResource'
              example:
                success: false
                message: "Unauthenticated."
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: Token yang diterima dari endpoint /login.

  responses:
    TooManyRequests:
      description: Terlalu banyak permintaan (rate limit `throttle:api`, 60/menit per user/IP).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResource'
          example:
            success: false
            message: "Too Many Attempts."

  schemas:
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: |
            Email ATAU `employee_number` (contoh `HM-0251`). Jika tidak
            mengandung `@`, backend mencocokkannya ke `employees.employee_number`.
          example: "HM-0251"
        email:
          type: string
          format: email
          deprecated: true
          description: Alias lama untuk `identifier`; dipertahankan sementara untuk kompatibilitas klien.
        password:
          type: string
          example: "rahasia123"
        device_name:
          type: string
          description: Nama perangkat untuk identifikasi token (opsional).
          example: "Android Pixel 7"

    AuthSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: [string, "null"]
          description: Pesan sukses; ada hanya jika backend mengisinya.
        data:
          type: object
          required: [token, token_type, must_change_password, user]
          properties:
            token:
              type: string
              description: Sanctum personal access token.
            token_type:
              type: string
              example: "Bearer"
            must_change_password:
              type: boolean
              description: Jika `true`, klien wajib mengarahkan pengguna ke halaman ganti password.
            user:
              $ref: '#/components/schemas/UserProfile'

    UserProfile:
      type: object
      required: [id, name, email, role, must_change_password, employee_number, employee]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [hr, employee]
        must_change_password:
          type: boolean
        employee_number:
          type: [string, "null"]
          description: Nomor karyawan; `null` untuk akun non-karyawan.
        employee:
          description: |
            Ringkasan karyawan. Login hanya mengembalikan `null`; `GET /me`
            mengisinya untuk akun yang terhubung ke record employee.
          oneOf:
            - $ref: '#/components/schemas/EmployeeSummary'
            - type: "null"

    EmployeeSummary:
      type: object
      required:
        - id
        - employee_number
        - full_name
        - work_email
        - job_title
        - division
        - employment_status
        - face_registered
        - face_registered_at
      properties:
        id:
          type: integer
        employee_number:
          type: string
          example: "HM-0251"
        full_name:
          type: string
        work_email:
          type: string
          format: email
        job_title:
          type: [string, "null"]
        division:
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id:
                  type: integer
                name:
                  type: string
            - type: "null"
        employment_status:
          type: string
          enum: [probation, active, contract, terminated]
        face_registered:
          type: boolean
          description: "`true` bila sudah ada template wajah aktif."
        face_registered_at:
          type: [string, "null"]
          format: date-time

    MeResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/UserProfile'

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password, new_password_confirmation]
      properties:
        current_password:
          type: string
          example: "R7$vQz2mKp9wXa4t"
        new_password:
          type: string
          minLength: 8
          description: Minimal 8 karakter dan harus berbeda dari password saat ini.
          example: "rahasiaBaru123"
        new_password_confirmation:
          type: string
          description: Harus sama dengan `new_password`.
          example: "rahasiaBaru123"

    SetInvitationPasswordRequest:
      type: object
      required: [new_password, new_password_confirmation]
      properties:
        new_password:
          type: string
          minLength: 8
          description: Kata sandi permanen baru, minimal 8 karakter.
          example: "rahasiaBaru123"
        new_password_confirmation:
          type: string
          description: Harus sama dengan `new_password`.
          example: "rahasiaBaru123"

    ChangePasswordResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: [string, "null"]
        data:
          type: object
          required: [must_change_password]
          properties:
            must_change_password:
              type: boolean
              example: false

    LogoutResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: [string, "null"]
        data:
          type: [object, "null"]
          description: Selalu `null` untuk logout.

    HealthResponse:
      type: object
      required: [status, timestamp, database]
      properties:
        status:
          type: string
          enum: [healthy, degraded]
        timestamp:
          type: string
          format: date-time
        database:
          type: string
          enum: [connected, error]
        database_error:
          type: [string, "null"]
          description: Pesan error database; hanya terisi saat APP_DEBUG=true.

    ErrorResource:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errors:
          type: [object, array, "null"]
          description: Detail validasi/kegagalan (opsional). Umumnya map field → daftar pesan.
